allowBuilds:
  esbuild: true
  sharp: true
# Dependency-security floor (2026-09-14 B/C-tier migration batch, issue #37):
# the A-tier batch pinned six transitive deps via overrides; the Astro 7
# upgrade resolved sharp/fast-uri/js-yaml/svgo natively past their advisory
# patch lines (and dropped extract-zip from the tree entirely), so those
# pins are reclaimed. fflate is the one remaining floor: @iconify/tools
# (astro-icon's SVG pipeline) still requires <0.7.5 upstream.
overrides:
  fflate: ^0.7.5

# Local setup: H: is exFAT, so dependencies must not use directory links.
nodeLinker: hoisted
packageImportMethod: copy
enableGlobalVirtualStore: false

# An in-repository store also avoids pnpm's project-registry directory link.
storeDir: .local-cache/pnpm-store
# Keep metadata and pnpm state inside the parent project folder.
cacheDir: ../.local-cache/pnpm-cache
stateDir: ../.local-cache/pnpm-state

# Use the installed pnpm 11 without attempting a symlink-based version install.
pmOnFail: warn
